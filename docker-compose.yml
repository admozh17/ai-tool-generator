services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_tool_generator
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tool_generator"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/ai_tool_generator?schema=public"
      JWT_SECRET: "dev-insecure-jwt-secret-change-me"
      RISK_SERVICE_BASE_URL: "http://localhost:3000"
      # Optional: set to enable LLM-backed generation. Empty -> rule-based composer.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
    ports:
      - "3000:3000"
